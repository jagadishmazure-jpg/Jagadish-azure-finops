[project]
name = "azure-finops"
version = "0.1.0"
description = "Azure FinOps and AI FinOps playbook as code: ten cost-optimization patterns, an AI cost layer, and a human-approved FinOps agent over MCP, all offline on synthetic data and a list-price snapshot."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jagadish Meduri" }]
requires-python = ">=3.13"
dependencies = [
  "mcp==2.3.0",       # FinOps agent exposed as an MCP server (in-process client in tests)
  "pyyaml==6.0.3",    # policy and guardrail config
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10"]

[project.scripts]
finops = "finops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501", "RUF012"]
